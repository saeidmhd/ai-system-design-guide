<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>راهنمای طراحی سیستم‌های هوش مصنوعی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0">
  <meta name="description" content="نسخه‌ی فارسی راهنمای طراحی سیستم‌های هوش مصنوعی: RAG، ایجنت‌ها، MCP، ارزیابی و آمادگی مصاحبه">
  <meta name="theme-color" content="#7c3aed">

  <!-- تم (روشن/تیره) و اندازهٔ متن را قبل از رندر اعمال کن تا چشمک نزند -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fa-theme');
        if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        var fs = parseInt(localStorage.getItem('fa-fs'), 10);
        if (fs >= 15 && fs <= 22) document.documentElement.style.setProperty('--fa-fs', fs + 'px');
      } catch (e) {}
    })();
  </script>

  <link rel="preload" href="assets/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/vue.css">
  <link rel="stylesheet" href="assets/fa-theme.css">
  <style>
    #load-error { padding: 2rem; font-family: Tahoma, sans-serif; color: #b91c1c; }
  </style>
</head>
<body>
  <div id="app">در حال بارگذاری…</div>
  <script>
    // اگر پس از چند ثانیه هنوز بارگذاری تمام نشده بود، پیام خطا نشان بده
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.textContent.trim() === 'در حال بارگذاری…') {
        app.innerHTML = '<div id="load-error">سایت بارگذاری نشد. فایل‌های پوشه‌ی assets را بررسی کنید یا کنسول مرورگر (F12) را باز کنید.</div>';
      }
    }, 8000);

    function loadMermaid(cb) {
      if (window.mermaid) return cb();
      var s = document.createElement('script');
      s.src = 'assets/mermaid.min.js';
      s.onload = function () { window.mermaid.initialize({ startOnLoad: false }); cb(); };
      document.head.appendChild(s);
    }

    function mermaidPlugin(hook) {
      hook.doneEach(function () {
        var blocks = document.querySelectorAll('pre[data-lang="mermaid"]');
        if (!blocks.length) return;
        loadMermaid(function () {
          blocks.forEach(function (pre) {
            try {
              var div = document.createElement('div');
              div.className = 'mermaid';
              div.textContent = pre.textContent;
              pre.parentNode.replaceChild(div, pre);
              window.mermaid.init(undefined, div);
            } catch (e) { console.warn('mermaid render failed', e); }
          });
        });
      });
    }
  </script>
  <script src="assets/fa-enhance.js"></script>
  <script>
    window.$docsify = {
      name: 'راهنمای طراحی سیستم‌های هوش مصنوعی',
      repo: 'https://github.com/saeidmhd/ai-system-design-guide',
      homepage: 'HOME.md',   // صفحه‌ی خانه‌ی سایت؛ README.md برای GitHub دست‌نخورده می‌ماند
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 3,
      search: {
        placeholder: 'جست‌وجو…',
        noData: 'نتیجه‌ای پیدا نشد',
        depth: 3,
        namespace: 'ai-system-design-guide-fa',
        maxAge: 86400000
      },
      plugins: [mermaidPlugin].concat(window.FaPlugins || [])
    };
  </script>
  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
</body>
</html>
