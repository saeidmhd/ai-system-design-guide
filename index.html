<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>راهنمای طراحی سیستم‌های هوش مصنوعی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0">
  <meta name="description" content="نسخه‌ی فارسی راهنمای طراحی سیستم‌های هوش مصنوعی: RAG، ایجنت‌ها، MCP، ارزیابی و آمادگی مصاحبه">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --theme-color: #7c3aed; }
    body, .markdown-section, .sidebar, .search input {
      font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    }
    /* متن اصلی راست‌به‌چین؛ سایدبار و چیدمان صفحه همان‌طور که هست */
    .markdown-section {
      direction: rtl; text-align: right;
      max-width: 900px; line-height: 2; font-size: 17px;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 { font-weight: 700; }
    .markdown-section blockquote { border-right: 4px solid var(--theme-color); border-left: 0; }
    .markdown-section ul, .markdown-section ol { padding-right: 1.6rem; padding-left: 0; }
    /* کد و نمودار و ساختار پوشه‌ها چپ‌به‌راست بمانند */
    .markdown-section pre, .markdown-section code, .markdown-section .mermaid {
      direction: ltr; text-align: left;
    }
    .markdown-section pre { font-size: 14px; line-height: 1.6; }
    .markdown-section code { font-family: "JetBrains Mono", Menlo, Consolas, monospace; }
    .markdown-section table { display: block; overflow-x: auto; }
    .sidebar { direction: rtl; text-align: right; }
    .sidebar ul li a { font-size: 15px; }
    .app-name-link { font-weight: 700; }
  </style>
</head>
<body>
  <div id="app">در حال بارگذاری…</div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
  <script>
    var mermaidId = 0;
    mermaid.initialize({ startOnLoad: false });
    window.$docsify = {
      name: 'راهنمای طراحی سیستم‌های هوش مصنوعی',
      repo: 'https://github.com/saeidmhd/ai-system-design-guide',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 3,
      search: {
        placeholder: 'جست‌وجو…',
        noData: 'نتیجه‌ای پیدا نشد',
        depth: 3
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' +
                mermaid.render('mermaid-' + (mermaidId++), code) + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
